[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle  F: pyflakes  I: isort  UP: pyupgrade
# B: flake8-bugbear  C4: flake8-comprehensions  RUF: Ruff-native rules
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = [
    "E501",   # line too long — formatter handles this
    "B008",   # do not perform function calls in default arguments (Dash patterns use this)
    "RUF012", # mutable class attributes — dataclasses use this intentionally
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to import private names and use assert statements freely.
"tests/**" = ["F401", "F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
# Strict mode is disabled to avoid false positives from Dash's dynamic typing.
# The settings below give meaningful coverage without noise.
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Exclude generated/external code and test helpers from type-checking.
exclude = ["tests/"]
